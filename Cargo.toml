[package]
name = "stille-messenger"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "crisp",
    "thread-pool",
    "linux-theme-detection",
    "x11",
    "wayland",
    "fira-sans",
    "tokio",
    "lazy",
    "markdown",
    "qr_code",
    "svg",
    "image",
    # Переход к сообщению (S16): `advanced::widget::operate` для операции
    # измерения позиции строки в ленте — iced не имеет scroll-into-view.
    "advanced",
] }
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros", "rt", "net", "io-util", "process"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-core = "0.3"
# Звук звонков (S7): захват/вывод устройств; ядро получает/отдаёт PCM
# через fifo ~/.stille-messenger/pcm (CORE-API §4.6, PROTOCOL §10).
cpal = "0.17"
# Файловый диалог (S10): нативный через xdg-portal (D-Bus, без gtk),
# асинхронный — update не блокируется.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Аватарки (S8б): выбранное фото сжимаем до 96×96 JPEG ≤ 16 КБ — лимит
# кадра ядра (§4.4). Та же версия, что тащит iced.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
futures-util = "0.3"
iced_test = "0.14"
png = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

# Артефакт релиза — не таскать debug-символы (23 МБ → ~10 МБ).
[profile.release]
strip = true
