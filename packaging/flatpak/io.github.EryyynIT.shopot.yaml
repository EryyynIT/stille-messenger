# Flatpak-манифест shopot: GUI + демон из prebuilt-бинарей.
# Сборка: flatpak-builder поверх уже собранных cargo build --release
# и zig build -Doptimize=ReleaseSafe.
#
# Локально (относительно корня репо):
#   flatpak-builder --user --install build-flatpak packaging/flatpak/io.github.EryyynIT.shopot.yaml
# В CI: см. .github/workflows/release.yml (шаг flatpak).

app-id: io.github.EryyynIT.shopot
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: shopot-gui

finish-args:
  - --share=network                       # P2P: LAN-мультикаст, прямые соединения
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio                   # звонки (S7)
  - --talk-name=org.freedesktop.Notifications  # уведомления через notify-send
  - --persist=.shopot                     # личность, лог, файлы (~/.var/app/.shopot)

modules:
  - name: shopot
    buildsystem: simple
    build-commands:
      # Клиент
      - install -Dm755 shopot-gui /app/bin/shopot-gui
      # Демон под именем «shopot» — UdsLink спавнит «shopot serve» из PATH
      - install -Dm755 shopot /app/bin/shopot
      # Desktop entry и иконка
      - install -Dm644 io.github.EryyynIT.shopot.desktop /app/share/applications/io.github.EryyynIT.shopot.desktop
      - install -Dm644 io.github.EryyynIT.shopot.png /app/share/icons/hicolor/256x256/apps/io.github.EryyynIT.shopot.png
      - install -Dm644 io.github.EryyynIT.shopot.metainfo.xml /app/share/metainfo/io.github.EryyynIT.shopot.metainfo.xml
    sources:
      - type: file
        path: ../../target/release/shopot-gui
      - type: file
        path: ../../core/zig/zig-out/bin/shopot-zig
        dest-filename: shopot
      - type: file
        path: io.github.EryyynIT.shopot.desktop
      - type: file
        path: ../../docs/icon.png
        dest-filename: io.github.EryyynIT.shopot.png
      - type: file
        path: ../io.github.EryyynIT.shopot.metainfo.xml
