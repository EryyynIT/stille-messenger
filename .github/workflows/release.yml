name: release

# Артефакты релиза: тег v* → клиент + демон одним архивом, один шаг запуска.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      # cpal (S7) линкуется с libasound — dev-файлы из пакета.
      - run: sudo apt-get install -y libasound2-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@v2

      - name: Build the daemon (Zig)
        # baseline: артефакт должен идти на любом x86_64, а не только
        # на CPU раннера (native по умолчанию даёт SIGILL на старых машинах).
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline
        working-directory: core/core

      - name: Build the client (Rust)
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p pkg
          cp target/release/stille-messenger pkg/
          cp core/core/zig-out/bin/stille-messenger-core pkg/
          cp run.sh README.md README.ru.md LICENSE pkg/
          tar -czf "stille-messenger-${GITHUB_REF_NAME}-x86_64-linux-gnu.tar.gz" -C pkg .
          sha256sum stille-messenger-*.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            stille-messenger-*.tar.gz
            SHA256SUMS
          body: |
            One archive: the client and the daemon for Linux x86_64.
            Extract and run `./run.sh` — it creates your identity on first
            start, launches the daemon in the background and opens the client.

            What's new in v0.1.1:

            - desktop notifications for incoming messages, with a "hide
              text" privacy setting on by default; the chat open in the
              focused window does not notify
            - settings panel: compact feed (no bubbles, everything
              left-aligned), font scale 80–150%
            - keyboard control: Ctrl+1..9 opens a chat by its position in
              the list, Ctrl+Q quits, Escape closes any dialog

            The daemon is built from the pinned
            [stille-messenger-core](https://github.com/Puxxalwl/stille-messenger-core) submodule
            (Zig 0.17.0). Building from source is covered in the README inside
            the archive.
